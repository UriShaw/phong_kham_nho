<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Không có quyền - MedPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f0fdf4, #ecfdf5); }
        .container { text-align: center; padding: 40px; }
        .error-code { font-size: 6rem; font-weight: 800; color: #EF4444; line-height: 1; }
        h2 { font-size: 1.5rem; margin: 16px 0 8px; color: #1f2937; }
        p { color: #6b7280; margin-bottom: 24px; }
        a { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; background: #22C55E; color: white; border-radius: 8px; text-decoration: none; font-weight: 600; transition: all 0.3s; }
        a:hover { background: #16A34A; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">403</div>
        <h2>Không có quyền truy cập</h2>
        <p>Bạn không có quyền truy cập trang này.</p>
        <a href="/">← Về trang chủ</a>
    </div>
</body>
</html>
