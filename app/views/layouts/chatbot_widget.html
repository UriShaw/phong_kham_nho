<!-- Widget Chatbot AI -->
<div class="chatbot-widget" id="chatbot-widget">
    <!-- Toggle Button -->
    <button class="chatbot-toggle" id="chatbot-toggle" title="Trợ lý sức khỏe AI">
        <i class="fas fa-comment-medical"></i>
    </button>

    <!-- Chat Window -->
    <div class="chatbot-window" id="chatbot-window">
        <div class="chatbot-header">
            <div class="chatbot-header-avatar">
                <i class="fas fa-robot"></i>
            </div>
            <div class="chatbot-header-info">
                <h4>Trợ lý MedPro</h4>
                <p>Trực tuyến • Tư vấn sức khỏe 24/7</p>
            </div>
            <button onclick="toggleChatbot()" style="background:none; border:none; color:white; cursor:pointer; font-size:1.2rem; margin-left:auto;">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="chatbot-messages" id="chatbot-messages">
            <!-- Tin nhắn chào mừng -->
            <div class="chat-message bot">
                <div class="chat-bubble">
                    Xin chào! 👋 Tôi là trợ lý sức khỏe MedPro.

Tôi có thể giúp bạn:
• Tư vấn triệu chứng bệnh
• Gợi ý chuyên khoa và bác sĩ
• Hướng dẫn đặt lịch khám
• Trả lời câu hỏi thường gặp

Bạn đang gặp vấn đề gì?
                </div>
            </div>
        </div>

        <div class="chat-suggestions" id="chat-suggestions">
            <button class="chat-suggestion-btn" onclick="sendChatMessage('Tôi bị đau đầu')">Tôi bị đau đầu</button>
            <button class="chat-suggestion-btn" onclick="sendChatMessage('Giờ khám bệnh')">Giờ khám</button>
            <button class="chat-suggestion-btn" onclick="sendChatMessage('Chi phí khám')">Chi phí</button>
            <button class="chat-suggestion-btn" onclick="sendChatMessage('Cách đặt lịch')">Đặt lịch</button>
        </div>

        <div class="chatbot-input">
            <input type="text" id="chatbot-input" placeholder="Nhập tin nhắn..."
                   onkeypress="if(event.key==='Enter') sendChatFromInput()">
            <button onclick="sendChatFromInput()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<style>
.chat-doctors{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.chat-doctor-card{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:#f0fdf4;border-radius:10px;border:1px solid #dcfce7;}
.chat-doc-info{display:flex;flex-direction:column;gap:1px;min-width:0;}
.chat-doc-info strong{font-size:.78rem;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-doc-info span{font-size:.68rem;color:#64748b;}
.chat-doc-price{font-weight:700;color:#059669 !important;}
.chat-book-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;background:#059669;color:#fff !important;font-size:.7rem;font-weight:700;text-decoration:none;white-space:nowrap;transition:all .2s;}
.chat-book-btn:hover{background:#047857;transform:scale(1.02);}
</style>

<script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
